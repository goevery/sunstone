name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: go
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-sunbeam:
    name: Publish Sunbeam image
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-docker.pkg.dev/every-oss/sunstone/sunbeam
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: every-oss
          workload_identity_provider: projects/673681396126/locations/global/workloadIdentityPools/continuous-integration/providers/github-actions
          service_account: github-actions@every-shared-services.iam.gserviceaccount.com
          token_format: access_token

      - name: Authenticate Buildah to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: printf '%s' "$ACCESS_TOKEN" | buildah login --username oauth2accesstoken --password-stdin us-docker.pkg.dev

      - name: Build and publish Sunbeam
        shell: bash
        run: |
          set -euo pipefail

          sha_tag="sha-${RELEASE_SHA:0:12}"
          version_image="${IMAGE}:${RELEASE_TAG}"

          make image IMAGE="$version_image"
          buildah tag "$version_image" "${IMAGE}:${sha_tag}"
          buildah tag "$version_image" "${IMAGE}:latest"

          buildah push "$version_image"
          buildah push "${IMAGE}:${sha_tag}"
          buildah push "${IMAGE}:latest"
